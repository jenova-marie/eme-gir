# Three-service layout: a one-shot `init` service handles first-boot
# data setup (download Oracc corpus, build SQLite indexes), then exits.
# `web` (gunicorn + Flask) and `mcp` (FastMCP HTTP transport) both
# depend on `init` completing successfully and start in parallel.
#
# Why the dedicated init service vs an entrypoint wrapper: first-boot
# init can take 5-15 minutes. Wrapping it inside web's startup would
# either:
#   (a) require a 30+ minute healthcheck start_period (ugly), or
#   (b) make `mcp` (which depends_on web: service_healthy) wait that
#       same 5-15 min before booting at all.
# A separate init service lets web + mcp keep tight ~30s healthchecks,
# and lets compose's `service_completed_successfully` condition gate
# both servers on the same one-time setup.
#
# corpus/, data/, log/ are bind-mounted from the host so:
#   1. The 6+ GB of indexes don't bake into the image;
#   2. Logs persist across container restarts (`tail -F log/mcp_server.log`);
#   3. Manual rebuilds (`python3 build_*.py` on the host) are visible
#      to running services without an image rebuild — the fast path
#      for active development.
#
# Ports publish to 127.0.0.1 only by default. Front the stack with
# nginx/caddy/traefik (sample fragment in README) for TLS + auth before
# binding to 0.0.0.0. There is NO in-app authentication on /mcp.

services:
  # One-shot data initializer. Runs before web/mcp on every `up` —
  # fast-paths to exit 0 in ~50ms when /app/data/.initialized exists
  # at the current INIT_VERSION; otherwise wipes data/ and rebuilds
  # everything from corpus zips. See init.sh for the trust model.
  init:
    build: .
    image: epsd2:latest
    container_name: epsd2-init
    command: /app/init.sh
    environment:
      # Toggle off to skip the longer optional builds; defaults are ON
      # because the MCP server's tool surface is incomplete without them.
      EPSD2_BUILD_COLLOCATIONS: "${EPSD2_BUILD_COLLOCATIONS:-1}"
      EPSD2_BUILD_ETCSL: "${EPSD2_BUILD_ETCSL:-1}"
    volumes:
      - ./corpus:/app/corpus     # init writes here on first boot
      - ./data:/app/data         # init wipes + populates
      - ./log:/app/log
    restart: "no"                # one-shot; never restart on completion

  web:
    image: epsd2:latest
    container_name: epsd2-web
    depends_on:
      init:
        condition: service_completed_successfully
    # 4 gunicorn workers — Flask routes are mostly SQLite point-lookups
    # (~5-50ms each), so workers > cores helps absorb burst traffic.
    # Tune via the WEB_WORKERS env var.
    command: >
      gunicorn
      --workers ${WEB_WORKERS:-4}
      --bind 0.0.0.0:5050
      --access-logfile -
      --error-logfile -
      'app:create_app()'
    ports:
      - "${WEB_BIND:-127.0.0.1}:5050:5050"
    volumes:
      - ./corpus:/app/corpus:ro
      - ./data:/app/data         # gunicorn worker-boot reruns the
                                 # version-gated migrations (no-op
                                 # after init pre-warmed them, but
                                 # the journal needs a writable dir)
      - ./log:/app/log
    restart: unless-stopped
    healthcheck:
      # Hits the glossary landing page (302 redirect to /epsd2/sux).
      # `curl --fail` treats 3xx as success.
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:5050/"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 15s          # init pre-warmed migrations, gunicorn
                                 # workers come up in <5s

  mcp:
    image: epsd2:latest
    container_name: epsd2-mcp
    depends_on:
      init:
        condition: service_completed_successfully
    command: >
      python3 mcp_server.py
      --transport http
      --host 0.0.0.0
      --port 5051
    environment:
      # OAuth 2.1 / Auth0 bearer-token auth. OFF by default — leave
      # EPSD2_REQUIRE_AUTH unset (or "0") and the HTTP transport runs
      # unauthenticated as before, expecting a reverse proxy to handle
      # access control. Set EPSD2_REQUIRE_AUTH=1 to enforce in-app:
      # tokens are validated as RS256 JWTs from the configured Auth0
      # tenant. See START.md "Adding Auth0 OAuth" for the full setup.
      EPSD2_REQUIRE_AUTH: "${EPSD2_REQUIRE_AUTH:-0}"
      EPSD2_AUTH0_TENANT_URL: "${EPSD2_AUTH0_TENANT_URL:-}"
      EPSD2_AUTH0_AUDIENCE: "${EPSD2_AUTH0_AUDIENCE:-}"
      EPSD2_AUTH0_RESOURCE_SERVER_URL: "${EPSD2_AUTH0_RESOURCE_SERVER_URL:-}"
      EPSD2_AUTH0_REQUIRED_SCOPE: "${EPSD2_AUTH0_REQUIRED_SCOPE:-mcp:access}"
      # MCP SDK DNS-rebinding protection. Default allowlist is
      # localhost + 127.0.0.1 only — behind a reverse proxy that
      # passes the public Host header through, MUST add the proxy's
      # hostname here or every request returns 421. Comma-separated.
      # localhost / 127.0.0.1 / ::1 are added automatically — only
      # list the public hostnames the proxy will use.
      EPSD2_ALLOWED_HOSTS: "${EPSD2_ALLOWED_HOSTS:-}"
      # Cross-origin Origin headers to accept (browser MCP clients).
      # Comma-separated; no auto-additions.
      EPSD2_ALLOWED_ORIGINS: "${EPSD2_ALLOWED_ORIGINS:-}"
      # Escape hatch — set truthy to disable DNS-rebinding checks
      # entirely. Only safe when the reverse proxy enforces Host
      # validation upstream.
      EPSD2_DISABLE_DNS_REBINDING_PROTECTION: "${EPSD2_DISABLE_DNS_REBINDING_PROTECTION:-0}"
      # Umami analytics — fire-and-forget per-tool-call telemetry.
      # Off when EPSD2_UMAMI_URL or EPSD2_UMAMI_WEBSITE_ID is unset.
      # When enabled, every tool invocation produces one event with
      # tool name + duration + success/error + arg-key names + result
      # count. Tool argument VALUES are never sent — see
      # umami_analytics.py for the privacy boundary.
      EPSD2_UMAMI_URL: "${EPSD2_UMAMI_URL:-}"
      EPSD2_UMAMI_WEBSITE_ID: "${EPSD2_UMAMI_WEBSITE_ID:-}"
      EPSD2_UMAMI_HOSTNAME: "${EPSD2_UMAMI_HOSTNAME:-epsd2-mcp}"
      EPSD2_UMAMI_API_KEY: "${EPSD2_UMAMI_API_KEY:-}"
    ports:
      - "${MCP_BIND:-127.0.0.1}:5051:5051"
    volumes:
      - ./corpus:/app/corpus:ro
      # NOT :ro despite the MCP server only doing SELECTs — SQLite
      # needs a writable directory next to the DB to create its
      # `-journal` (or `-wal`) file even for read-only transactions.
      # `:ro` here yields `sqlite3.OperationalError: unable to open
      # database file` on the first tool call. Mark the SQLite files
      # `chmod a-w` on the host if you really need write protection;
      # the journal mechanism only needs the *directory* writable.
      - ./data:/app/data
      - ./log:/app/log
    restart: unless-stopped
    healthcheck:
      # /mcp returns 307 redirect to /mcp/; --fail accepts 3xx.
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:5051/mcp/"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 15s
